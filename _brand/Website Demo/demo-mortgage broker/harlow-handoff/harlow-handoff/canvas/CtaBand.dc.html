<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Closing call to action and enquiry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/bb73c46a29dda8d5bc98263b6ddb0aa1">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section class="band band-w2" aria-labelledby="{{hid}}" id="enquire" style="font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif">
<div class="wrap">
<div class="intro rv rise">
<h2 class="h2" id="{{hid}}">{{hLead}}<em class="ul">{{hBrush}}</em>{{hTail}}</h2>
<p class="lead">{{sub}} We'll call you back within <span class="ph">[PLACEHOLDER 1 business day]</span>.</p>
</div>
<div class="cta-grid">
<div class="rv rise" style="--d: 60ms">
<dc-import name="Enquiry" variant="inline" prefill="{{prefill}}" hint-size="100%,640px"></dc-import>
</div>
<aside class="talk rv rise" style="--d: 140ms" aria-label="Contact details">
<p class="h3">Rather talk now?</p>
<a class="bigphone" href="{{phoneHref}}">{{phone}}</a>
<div class="kv">
<div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>{{hours}}</span></div>
<div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg><span><span class="ph">[PLACEHOLDER street address]</span>, {{office}}</span></div>
<div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6 8.5 7 8.5-7"></path></svg><a href="{{mailHref}}">{{email}}</a></div>
</div>
<div class="map">
<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="#E6EDFB"></rect><path d="M0 70 L400 40 M0 160 L400 140 M0 225 L400 215 M80 0 L110 250 M210 0 L200 250 M320 0 L300 250" stroke="#FFFFFF" stroke-width="10" fill="none"></path><path d="M0 115 C120 100 260 120 400 95" stroke="#F8FAFF" stroke-width="16" fill="none"></path><rect x="226" y="160" width="58" height="40" rx="6" fill="#DCE5D2"></rect><rect x="20" y="180" width="44" height="30" rx="6" fill="#DCE5D2"></rect></svg>
<div class="pin"><b>Harlow Home Loans</b><svg width="28" height="34" viewBox="0 0 28 34" aria-hidden="true"><path d="M14 33s12-10.3 12-19A12 12 0 0 0 2 14c0 8.7 12 19 12 19Z" fill="#1F45D6"></path><circle cx="14" cy="14" r="4.5" fill="#fff"></circle></svg></div>
<span class="lab ph">[PLACEHOLDER map]</span>
</div>
<a class="textlink" href="https://www.google.com/maps/search/?api=1&amp;query=Box+Hill+VIC+3128">Get directions <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</aside>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hLead":{"editor":null},"hBrush":{"editor":null},"hTail":{"editor":null},"sub":{"editor":null},"prefill":{"editor":null},"$preview":{"width":1440,"height":1000}}'>
const CONFIG = {
  contact: { phone: "(03) 5550 2861", phoneHref: "tel:+61355502861", email: "hello@harlowhomeloans.example", office: "[PLACEHOLDER suburb] VIC" },
  hours: "Mon–Fri 8:30am–6pm, Sat by appointment, evening video calls"
};
class Component extends DCLogic {
  constructor(props) { super(props); this.fallbackPrefill = { source: 'Website' }; }
  renderVals() {
    const p = this.props;
    return {
      hid: 'cta-h',
      hLead: p.hLead ?? "Let's work out your next ", hBrush: p.hBrush ?? 'step', hTail: p.hTail ?? '',
      sub: p.sub ?? 'Book a free 20-minute chat.',
      prefill: p.prefill || this.fallbackPrefill,
      phone: CONFIG.contact.phone, phoneHref: CONFIG.contact.phoneHref, email: CONFIG.contact.email, mailHref: 'mailto:' + CONFIG.contact.email, office: CONFIG.contact.office, hours: CONFIG.hours
    };
  }
}
</script>
</body>
</html>
