<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reviews · Eastside Trades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="reviews" data-title="Reviews">
<div class="site">
<a class="skip" href="#main">Skip to content</a>

<header class="site-header"></header>

<main id="main">
<section class="page-hero" style="padding-bottom: 40px">
  <div class="wrap">
    <h1 class="h1-page">What neighbours say about us</h1>
    <p class="lede"><span class="ph" data-c="rating">4.9</span> average from <span class="ph" data-c="reviewCount">612</span> Google reviews. Here are some recent ones, by trade and suburb.</p>
  </div>
</section>

<!-- Reviews grid with filters -->
<section class="sec rg-tight" id="rg" data-rg="all"></section>

<!-- Booking -->
<section class="sec band-w2" id="book" data-reveal="book" aria-labelledby="book-h">
  <div class="wrap">
    <div class="intro r r-rise">
      <h2 id="book-h" class="h2">Tell us what needs <span class="brush">fixing</span></h2>
      <p class="lede">We'll text you a time within <span class="ph" data-c="responseTime">1 business hour</span>, then again when we're 30 minutes away.</p>
    </div>
    <div class="book-grid" id="book-grid"></div>
  </div>
</section>

</main>

<footer class="footer"></footer>
</div>
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
