<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<canvas ref="{{ cvRef }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent 100%); mask-image: radial-gradient(closest-side, #000 35%, transparent 100%);"></canvas>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;600px&quot;, &quot;height&quot;: &quot;500px&quot;}, &quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;bubbles&quot;, &quot;glass&quot;, &quot;ribbon&quot;, &quot;caustic&quot;, &quot;leak&quot;], &quot;default&quot;: &quot;bubbles&quot;, &quot;tsType&quot;: &quot;'bubbles' | 'glass' | 'ribbon' | 'caustic' | 'leak'&quot;}, &quot;flip&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  cvRef = React.createRef();
  // Neighbouring sections use different modes so no two in a row share a background.
  static MODES = { bubbles: 0, glass: 1, ribbon: 2, caustic: 3, leak: 4 };
  static FS = `precision highp float;
uniform vec2 r;uniform float t;uniform float md;uniform vec2 m;uniform float e;
const vec3 BL=vec3(0.,.478,.91);const vec3 CY=vec3(.459,.875,.933);const vec3 DB=vec3(0.,.345,.77);
float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float F(vec2 p,float asp){float f=0.;
 for(int i=0;i<4;i++){float fi=float(i);
  vec2 c=vec2((.5+.3*sin(t*.16+fi*2.1))*asp,.5+.24*cos(t*.13+fi*1.7));
  float rr=.13+.03*sin(t*.3+fi);vec2 d=p-c;f+=rr*rr/dot(d,d);}
 vec2 d=p-vec2(m.x*asp,m.y);f+=.008*e/dot(d,d);return f;}
vec4 glass(vec2 q,float asp){
 vec2 p=vec2(q.x*asp,q.y);float f=F(p,asp);vec2 k=vec2(.0015,0.);
 vec2 g=vec2(F(p+k.xy,asp)-F(p-k.xy,asp),F(p+k.yx,asp)-F(p-k.yx,asp));vec2 n=-normalize(g+1e-5);
 float ins=smoothstep(.96,1.04,f);float depth=clamp((f-1.)/2.,0.,1.);
 vec3 base=mix(CY,BL,clamp(q.y*.8+n.y*.3+.2,0.,1.));base=mix(base,DB,depth*.5);
 vec3 refr=mix(vec3(1.),base,.35+.55*smoothstep(1.,2.5,f));
 float rim=ins*(1.-smoothstep(1.,1.5,f));
 float spec=pow(max(dot(n,normalize(vec2(-.5,.85))),0.),6.)*rim;
 vec3 irid=.5+.5*cos(6.283*(rim+vec3(0.,.33,.67)+t*.05));
 vec3 col=refr+irid*rim*.25+vec3(1.)*spec*.9;
 float a=ins*.85;float glow=(1.-ins)*smoothstep(.35,.95,f)*.16;
 return vec4(col*a+BL*glow,a+glow);}
vec4 bubbles(vec2 q,float asp){
 vec2 p=vec2(q.x*asp,q.y);vec4 o=vec4(0.);
 for(int i=0;i<9;i++){float fi=float(i);
  float s1=hs(vec2(fi,1.3)),s2=hs(vec2(fi,7.1)),s3=hs(vec2(fi,3.7));
  float rad=(.05+.11*s2*s2);
  float y=fract(t*(.012+.018*s3)+s1)*1.5-.25;
  float x=(.1+.8*hs(vec2(fi,9.9)))*asp+.05*sin(t*.2+fi*2.)*asp;
  vec2 c=vec2(x,y);vec2 dm=c-vec2(m.x*asp,m.y);c+=normalize(dm+1e-4)*.05*e*exp(-dot(dm,dm)/.06);
  vec2 d=(p-c)/rad;float l=dot(d,d);
  if(l<1.){vec3 n=vec3(d,sqrt(1.-l));float f=pow(1.-n.z,2.4);
   vec3 tint=mix(CY,BL,clamp(.5-n.y*.5+n.x*.2,0.,1.));tint=mix(tint,DB,f*.35);
   vec3 irid=.5+.5*cos(6.283*(f*1.4+vec3(0.,.33,.67)+t*.04+fi*.1));
   float sp=pow(max(dot(n,normalize(vec3(-.45,.6,.65))),0.),40.);
   vec3 col=mix(vec3(1.),tint,.25+.55*f)+irid*f*.22+vec3(1.)*sp;
   float a=clamp(.1+f*.7+sp,0.,1.)*smoothstep(1.,.9,l);
   o.rgb=o.rgb*(1.-a)+col*a;o.a=o.a+a*(1.-o.a);}
  else{float g=exp(-(sqrt(l)-1.)*5.)*.08;o.rgb+=BL*g*(1.-o.a);o.a+=g*(1.-o.a);}}
 return o;}
vec4 ribbon(vec2 q,float asp){\n float fx=fract(gl_FragCoord.x/(r.x/18.));q.x+=(fx-.5)*.025;\n vec3 c=vec3(0.);float a=0.;\n for(int i=0;i<3;i++){float fi=float(i);\n  float y=.52+.16*sin(q.x*2.4+t*.22+fi*1.9)+.07*sin(q.x*5.3-t*.17+fi*.7)+(m.y-.5)*.1*e;\n  float w=.075+.03*sin(t*.19+fi*2.);\n  float d=(q.y-y-(fi-1.)*.09)/w;float b=exp(-d*d*1.6);\n  vec3 col=BL;if(i==1)col=CY;if(i==2)col=DB;\n  float sp=exp(-pow((d+.55)*4.,2.))*(.5+.5*sin(q.x*9.-t*.6+fi));\n  c+=col*b*.8+vec3(1.)*sp*b*.9;a+=b*.75;}\n a=clamp(a,0.,1.);c+=vec3(1.)*smoothstep(.85,1.,fx)*.3*a;\n return vec4(c,a);}\nvec4 caustic(vec2 q,float asp){\n vec2 p=vec2(q.x*asp,q.y)*5.+vec2(17.,3.);vec2 i=p;float c=1.;\n for(int n=0;n<4;n++){float tt=t*.3*(1.-(3.5/float(n+1)));\n  i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));\n  c+=1./length(vec2(p.x/(sin(i.x+tt)/.005),p.y/(cos(i.y+tt)/.005)));}\n c/=4.;c=1.17-pow(c,1.4);float v=clamp(pow(abs(c),8.),0.,1.);\n float a=clamp(v*.6+.1,0.,1.);\n vec3 col=mix(BL,CY,q.x)*a+vec3(1.)*v*.25;\n return vec4(col,a);}\nvec4 leak(vec2 q,float asp){\n vec2 s=vec2(asp*.7,1.);vec2 c1=vec2(-.1+.15*sin(t*.12),.85+.1*cos(t*.1));\n float l1=exp(-dot((q-c1)*s,(q-c1)*s)/.18);\n vec2 c2=vec2(1.05,.15+.1*sin(t*.09));float l2=exp(-dot((q-c2)*s,(q-c2)*s)/.12);\n float st=exp(-pow((q.y-.62-.05*sin(t*.15))*28.,2.))*(.4+.6*(sin(q.x*2.+t*.3)*.5+.5));\n float sw=exp(-pow((q.x+q.y*.4-mod(t*.06,2.2)+.4)*6.,2.))*.35;\n vec3 col=BL*l1*.9+CY*l2*.8+vec3(.85,.93,1.)*(st*.35+sw);\n return vec4(col,max(max(col.r,col.g),col.b));}\nvoid main(){vec2 q=gl_FragCoord.xy/r;float asp=r.x/r.y;vec4 o;
 if(md<.5)o=bubbles(q,asp);else if(md<1.5)o=glass(q,asp);else if(md<2.5)o=ribbon(q,asp);else if(md<3.5)o=caustic(q,asp);else o=leak(q,asp);
 o.rgb+=(hs(gl_FragCoord.xy)-.5)*.006*o.a;gl_FragColor=o;}`;

  static shared() {
    if (window.__locAmb) return window.__locAmb;
    const off = document.createElement('canvas');
    const gl = off.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
    const S = { list: [], gl, off, T: 6, last: performance.now(), raf: null };
    window.__locAmb = S;
    if (!gl) return S;
    const sh = (ty, src) => { const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, Component.FS)); gl.linkProgram(pr); gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    S.U = {}; ['r', 't', 'md', 'm', 'e'].forEach(k => S.U[k] = gl.getUniformLocation(pr, k));
    S.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { const ext = gl.getExtension('WEBGL_debug_renderer_info'); const rn = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : ''; if (/swiftshader|llvmpipe|software|basic render/i.test(rn)) S.slow = true; } catch (e) {}
    S.budget = 0;
    S.draw = (it) => {
      const { cv, c2 } = it; if (gl.isContextLost() || !cv.width) return;
      if (off.width < cv.width || off.height < cv.height) { off.width = Math.max(off.width, cv.width); off.height = Math.max(off.height, cv.height); }
      it.mx += (it.tx - it.mx) * .05; it.my += (it.ty - it.my) * .05; it.e += (it.te - it.e) * .04;
      gl.viewport(0, 0, cv.width, cv.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(S.U.r, cv.width, cv.height); gl.uniform1f(S.U.t, S.T + it.seed); gl.uniform1f(S.U.md, it.md);
      gl.uniform2f(S.U.m, it.mx, it.my); gl.uniform1f(S.U.e, it.e);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      c2.clearRect(0, 0, cv.width, cv.height); c2.drawImage(off, 0, off.height - cv.height, cv.width, cv.height, 0, 0, cv.width, cv.height); it.drawn = true;
    };
    const frame = (now) => {
      const dt = Math.min(.05, (now - S.last) / 1000); S.last = now;
      const still = S.reduced || S.slow;
      if (!still) S.T += dt;
      const f0 = performance.now();
      const vh = window.innerHeight;
      S.flip = !S.flip;
      for (const it of S.list) {
        if (!it.vis) continue;
        if (!still) { const r = it.host.getBoundingClientRect(); const o = ((r.top + r.height / 2) - vh / 2) * -0.06; it.cv.style.transform = 'translate3d(0,' + o.toFixed(1) + 'px,0)' + (it.flip ? ' scaleX(-1)' : ''); }
        if (!still || !it.drawn) S.draw(it);
      }
      const cost = performance.now() - f0;
      if (!still && cost > 30) { S.budget++; if (S.budget > 20) S.slow = true; } else if (S.budget > 0) S.budget--;
      S.raf = requestAnimationFrame(frame);
    };
    S.raf = requestAnimationFrame(frame);
    return S;
  }

  componentDidMount() {
    const cv = this.cvRef.current; if (!cv) return;
    let S; try { S = Component.shared(); } catch (err) { console.warn('ambient', err && err.message); cv.style.display = 'none'; return; }
    if (!S.gl) { cv.style.display = 'none'; return; }
    const flip = !!this.props.flip;
    const it = this.it = { cv, c2: cv.getContext('2d'), md: Component.MODES[this.props.mode] ?? 0, flip, vis: false, drawn: false, mx: .5, my: .5, tx: .5, ty: .5, e: 0, te: 0, seed: Math.random() * 40, host: cv.closest('section') || cv.parentElement };
    if (flip) cv.style.transform = 'scaleX(-1)';
    const size = () => { const cw = cv.clientWidth, ch = cv.clientHeight; let s = Math.min(window.devicePixelRatio || 1, 2); const px = cw * ch * s * s, cap = 2600000; if (px > cap) s *= Math.sqrt(cap / px); const w = Math.max(2, Math.round(cw * s)), hh = Math.max(2, Math.round(ch * s)); if (w === cv.width && hh === cv.height) return; cv.width = w; cv.height = hh; it.drawn = false; };
    size();
    this.ro = new ResizeObserver(size); this.ro.observe(cv);
    this.io = new IntersectionObserver(([en]) => { it.vis = en.isIntersecting; }, { rootMargin: '160px' }); this.io.observe(cv);
    this.pm = ev => { const r = cv.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width; it.tx = flip ? 1 - x : x; it.ty = 1 - (ev.clientY - r.top) / r.height; it.te = 1; };
    this.pl = () => { it.te = 0; };
    it.host.addEventListener('pointermove', this.pm); it.host.addEventListener('pointerleave', this.pl);
    S.list.push(it);
  }
  componentWillUnmount() {
    const S = window.__locAmb; if (S && this.it) S.list = S.list.filter(x => x !== this.it);
    this.ro && this.ro.disconnect(); this.io && this.io.disconnect();
    if (this.it) { this.it.host.removeEventListener('pointermove', this.pm); this.it.host.removeEventListener('pointerleave', this.pl); }
  }
  renderVals() { return { cvRef: this.cvRef }; }
}
</script>
