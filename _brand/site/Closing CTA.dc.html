<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Closing CTA" style="position: relative; overflow: hidden; isolation: isolate; background: radial-gradient(70% 90% at 85% 10%, #dfeafa 0%, rgba(223,234,250,0) 70%), radial-gradient(60% 70% at 5% 100%, rgba(117,223,238,.22) 0%, rgba(117,223,238,0) 70%), #fbfcff; border-top: 1px solid #eef1f5; padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 40px); font-family: var(--font-body);">
  <dc-import name="Ambient" mode="glass" style="position: absolute; z-index: -1; right: -12%; top: -20%; width: 56%; height: 140%; opacity: .7; pointer-events: none;" hint-size="56%,100%"></dc-import>
  <div style="max-width: 1180px; margin: 0 auto;">
    <div style="font-family: var(--font-mono); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #0058c4;">{{ eyebrow }}</div>
    <h2 style="margin: 18px 0 0; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.035em; line-height: 1.08; font-size: clamp(32px, 4vw, 54px); color: #0d0d0d; text-wrap: balance; max-width: 760px;">{{ titleA }} <span style="color: #0058c4;">{{ titleB }}</span>{{ titleC }}</h2>
    <p style="margin: 20px 0 0; max-width: 600px; font-size: 17px; line-height: 1.6; color: #2b2e33; text-wrap: pretty;">{{ lead }}</p>
    <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px;">
      <x-import component-from-global-scope="LocateDigitalDesignSystem_08c31d.Button" dc-props="{{ btnProps }}" hint-size="270px,60px">Request a consultation →</x-import>
    </div>
    
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;520px&quot;}, &quot;eyebrow&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;NEXT STEP&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;titleA&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Talk to a senior strategist about&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;titleB&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;your firm&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;titleC&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;lead&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;primary&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    return {
      eyebrow: P.eyebrow ?? 'Next step',
      titleA: P.titleA ?? 'Talk to a senior strategist about', titleB: P.titleB ?? 'your firm', titleC: P.titleC ?? '.',
      lead: P.lead ?? 'A short, private conversation about where your enquiries come from today, where AI could save your team time, and what we would do first.',
      btnProps: { variant: (P.primary ?? true) ? 'primary' : 'secondary', size: 'lg', href: '/consultation' }
    };
  }
}
</script>
</body>
</html>
