<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<footer style="background: #0d0d0d; color: #b8bbc0; padding: 64px clamp(20px, 4vw, 40px) 36px; font-family: var(--font-body);">
  <div style="max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 40px 32px;">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <img src="/assets/lockup-white.png" alt="Locate Digital" width="82" height="28" style="height: 28px; width: auto; align-self: flex-start;">
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6;">Marketing and practical AI for Australian financial service providers.</p>
    </div>
    <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px;">
        <div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: #8d9096; margin-bottom: 4px;">{{ col.head }}</div>
        <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="3">
          <a href="{{ l.href }}" style="color: #e6e6e6; padding: 2px 0;" style-hover="color: #ffffff;">{{ l.label }}</a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="max-width: 1180px; margin: 48px auto 0; padding-top: 20px; border-top: 1px solid #2a2d31; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; color: #8d9096;">
    <span>© 2026 LOCATE DIGITAL · ABN 26 531 883 132</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;360px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const L = (label, href) => ({ label, href });
    return { cols: [
      { head: 'MARKETING', links: [L('Paid Ads', '/paid-ads'), L('CRO', '/cro'), L('Email Marketing', '/email-marketing')] },
      { head: 'AI', links: [L('AI Integrations and Training', '/ai-integrations-and-training'), L('AI Readiness Assessment', '/ai#assessment'), L('AI overview', '/ai')] },
      { head: 'FIRM', links: [L('Who we work with', '/who-we-work-with'), L('Approach', '/approach'), L('About', '/about'), L('Privacy policy', '/privacy')] },
      { head: 'CONTACT', links: [L('Request a consultation', '/consultation')] }
    ] };
  }
}
</script>
</body>
</html>
