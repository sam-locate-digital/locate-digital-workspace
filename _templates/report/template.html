<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{heading_font_url}}" rel="stylesheet">
<link href="{{body_font_url}}" rel="stylesheet">
<style>{{css}}</style>
</head>
<body>
<header class="cover-band">
  <div class="cover-inner">
    <img class="logo" src="{{logo_inverse_data_uri}}" alt="Locate Digital">
    <div class="meta">
      <div class="kicker">Monthly performance report</div>
      <div class="client">{{client_name}}</div>
      <div class="period">{{period_label}}</div>
    </div>
  </div>
</header>
<main class="page">
{{body}}
</main>
<footer class="page-footer">
  <div class="inner">
    <div><span class="brand-mark">Locate Digital</span> · locatedigital.io · sam@locatedigital.io</div>
    <div>Generated {{generated_at}}</div>
  </div>
</footer>
</body>
</html>
